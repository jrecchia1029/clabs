# STP Triangle with MLAG Base
#
# 4 nodes: core1, core2, leaf1a, leaf1b
#
# Topology (ring):
#
#   [core1] eth1 --- eth1 [core2]
#      eth2                  eth2
#       |                     |
#      eth2                  eth2
#   [leaf1a] eth1 --- eth1 [leaf1b]
#
# Connections:
#   core1:eth1  --- core2:eth1  (core1 to core2)
#   core1:eth2  --- leaf1a:eth2 (core1 to leaf1a)
#   core2:eth2  --- leaf1b:eth2 (core2 to leaf1b)
#   leaf1a:eth1 --- leaf1b:eth1 (leaf1a to leaf1b)

name: stp-triangle-with-mlag-base

mgmt:
  network: mgmt
  ipv4-subnet: 172.100.100.0/24

topology:
  defaults:
    kind: arista_ceos

  kinds:
    arista_ceos:
      image: arista/ceos:latest
      env:
        CLAB_MGMT_VRF: MGMT
        INTFTYPE: eth
        ETBA: 1
        SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT: 1

  nodes:
    core1:
      kind: arista_ceos
    core2:
      kind: arista_ceos
    leaf1a:
      kind: arista_ceos
    leaf1b:
      kind: arista_ceos

  links:
    # core1 Eth1 --- core2 Eth1
    - endpoints: ["core1:eth1", "core2:eth1"]
    # core1 Eth2 --- leaf1a Eth2
    - endpoints: ["core1:eth2", "leaf1a:eth2"]
    # core2 Eth2 --- leaf1b Eth2
    - endpoints: ["core2:eth2", "leaf1b:eth2"]
    # leaf1a Eth2 --- leaf1b Eth1
    - endpoints: ["leaf1a:eth1", "leaf1b:eth1"]

